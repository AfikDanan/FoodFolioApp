[project]
name = "foodfolio-pricedata"
version = "0.1.0"
description = "Ingest Israeli supermarket price files and price a FoodFolio shopping list."
requires-python = ">=3.12"
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
